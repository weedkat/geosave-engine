[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geosave-engine"
dynamic = ["version"]
description = 'Library for geospatial machine learning, focusing providing pretrained model, and uploading map collection to geosave-app'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Fatah Muria", email = "fatahmurbaut@gmail.com" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "gdown>=5.2.2",
    "geopandas>=0.14.0",
    "scipy>=1.11.0",
    "lightning>=2.3.3",
    "matplotlib>=3.7.5",
    "mlflow>=2.17.2",
    "numpy>=1.24.4",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "planetary-computer>=1.0.0",
    "pyarrow>=17.0.0",
    "pystac>=1.8.4",
    "pystac-client>=0.7.6",
    "rioxarray>=0.15.0",
    "rasterio>=1.3.11",
    "stackstac>=0.5.0",
    "xarray>=2023.1.0",
    "zarr>=3.0.0",
    "python-dotenv>=1.0.1",
    "pyproj>=3.6.0",
    "pyyaml>=6.0.3",
    "rich>=13.7.1",
    "scikit-learn>=1.3.2",
    "segmentation-models-pytorch>=0.3.3",
    "tensorboard>=2.14.0",
    "toml>=0.10.2",
    "torchgeo>=0.2.1",
    "typer>=0.20.1",
    "tqdm>=4.67.3",
    "s2cloudless>=1.7.3",
    "odc-stac>=0.5.2",
    "cogeo-mosaic>=9.2.0",
    "cql2>=0.5.6",
    "boto3>=1.42.91",
    "odc-geo>=0.5.1",
    "geopy>=2.4.0",
    "albumentations>=2.0.8",
    "folium>=0.20.0",
    "mapclassify>=2.8.1",
    "kornia>=0.8.2",
    "wget>=3.2",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.0.0",
    "transformers>=5.9.0",
    "terratorch>=1.2.7",
    "python-box>=7.0.0",
    "tenacity>=9.1.4",
    "tifffile>=2023.1.1",
    "pydantic>=2.0.0",
    "typing_extensions>=4.0.0",
    "networkx>=3.6.1",
    "xformers>=0.0.35",
    "torchsummary>=1.5.1",
    "xcube-core>=1.6.0",
    "litdata>=0.2.67",
    "questionary>=2.1.1",
    "tomlkit>=0.15.1",
]

[project.urls]
Documentation = "https://github.com/weedkat/geosave-engine#readme"
Issues = "https://github.com/weedkat/geosave-engine/issues"
Source = "https://github.com/weedkat/geosave-engine"

[project.scripts]
geosave = "geosave_engine.cli.main:app"

[tool.hatch.version]
path = "src/geosave_engine/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geosave_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "-m", "not slow and not integration"]
markers = [
  "slow: marks tests as slow (large-memory model variants); deselect by default",
  "integration: marks tests that hit external services (e.g. CDSE STAC, S3)",
]

[tool.uv]
managed = true
package = true

[tool.coverage.run]
source_pkgs = ["geosave_engine", "tests"]
branch = true
parallel = true
omit = [
  "src/geosave_engine/__about__.py",
]

[tool.coverage.paths]
geosave_engine = ["src/geosave_engine"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
  "ipywidgets>=8.1.8",
  "mypy>=1.0.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.5",
  "ruff>=0.15.10",
  "zensical>=0.0.2",
]
