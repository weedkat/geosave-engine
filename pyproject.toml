[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geosave-engine"
dynamic = ["version"]
description = 'Library for geospatial machine learning, focusing providing pretrained model, and uploading map collection to geosave-app'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Fatah Muria", email = "fatahmurbaut@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "lightning>=2.3.3",
    "matplotlib>=3.7.5",
    "mlflow>=2.17.2",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.0",
    "scikit-learn>=1.3.2",
    "segmentation-models-pytorch>=0.3.3",
    "tensorboard>=2.14.0",
    "toml>=0.10.2",
    "typer>=0.20.1",
    "xformers>=0.0.28.post1",
]

[project.urls]
Documentation = "https://github.com/Fatah Muria/geosave-engine#readme"
Issues = "https://github.com/Fatah Muria/geosave-engine/issues"
Source = "https://github.com/Fatah Muria/geosave-engine"

[project.scripts]
geosave = "geosave_engine.cli.main:app"

[tool.hatch.version]
path = "src/geosave_engine/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.build]
include = [
  "src/templates/**",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/geosave_engine tests}"

[tool.coverage.run]
source_pkgs = ["geosave_engine", "tests"]
branch = true
parallel = true
omit = [
  "src/geosave_engine/__about__.py",
]

[tool.coverage.paths]
geosave_engine = ["src/geosave_engine", "*/geosave-engine/src/geosave_engine"]
tests = ["tests", "*/geosave-engine/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.10",
    "zensical>=0.0.2",
]
