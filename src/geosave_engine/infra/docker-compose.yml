services:

  # ── Core ──────────────────────────────────────────────────────────────────
  mlflow-db:
    # Plain Postgres — MLflow's tracking/registry backend store only.
    # Rasters are plain COGs in the storage bucket, no STAC catalog DB.
    # Pin this tag before going to production.
    image: postgres:16-alpine
    restart: always
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-geosave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-geosave}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geosave} -d ${POSTGRES_DB:-geosave}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    expose:
      - "9000"
      - "9001"
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-minioadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  create-buckets:
    image: amazon/aws-cli:2.33.25
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - backend_net
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_ADDRESSING_STYLE: path
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:9000}
      S3_BUCKET_PREDICTIONS: ${S3_BUCKET_PREDICTIONS:-predictions}
      S3_BUCKET_MLFLOW: ${S3_BUCKET_MLFLOW:-mlflow-artifacts}
    entrypoint: >
      /bin/sh -c "
        set -e
        for bucket in ${S3_BUCKET_PREDICTIONS:-predictions} ${S3_BUCKET_MLFLOW:-mlflow-artifacts}; do
          if aws --endpoint-url=${S3_ENDPOINT_URL:-http://storage:9000} s3api head-bucket --bucket $${bucket} 2>/dev/null; then
            echo \"Bucket $${bucket} already exists.\";
          else
            echo \"Creating bucket $${bucket}...\";
            aws --endpoint-url=${S3_ENDPOINT_URL:-http://storage:9000} s3api create-bucket --bucket $${bucket} --region ${AWS_DEFAULT_REGION:-us-east-1};
          fi
        done
      "

  # ── Profile: mlflow ───────────────────────────────────────────────────────
  mlflow:
    profiles: [mlflow]
    image: ghcr.io/mlflow/mlflow:v3.11.1
    restart: always
    ports:
      - "${MLFLOW_PORT:-5000}:${MLFLOW_PORT:-5000}"
    depends_on:
      mlflow-db:
        condition: service_healthy
      storage:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    networks:
      - backend_net
    environment:
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://${POSTGRES_USER:-geosave}:${POSTGRES_PASSWORD:-changeme}@mlflow-db:5432/${POSTGRES_DB:-geosave}"
      MLFLOW_ARTIFACTS_DESTINATION: "s3://${S3_BUCKET_MLFLOW:-mlflow-artifacts}"
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:9000}
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: ${MLFLOW_PORT:-5000}
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host 0.0.0.0 \
          --port "${MLFLOW_PORT:-5000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT:-5000}/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Profile: viz ──────────────────────────────────────────────────────────
  titiler:
    profiles: [viz]
    image: ghcr.io/developmentseed/titiler:latest
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      create-buckets:
        condition: service_completed_successfully
    networks:
      - backend_net
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${S3_ENDPOINT_URL:-http://storage:9000}
      AWS_VIRTUAL_HOSTING: "FALSE"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      GDAL_CACHEMAX: "200"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "5000000"
      TITILER_API_DEBUG: "false"
      RIO_TILER_MAX_THREADS: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Profile: db-admin ─────────────────────────────────────────────────────
  adminer:
    profiles: [db-admin]
    image: adminer
    restart: always
    networks:
      - backend_net
    depends_on:
      - mlflow-db
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend_net:
    name: geosave_backend_net

volumes:
  mlflow_db_data:
  storage_data:
