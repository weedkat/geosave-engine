schema_version: 1
sources:
  optical:
    variables: [red, nir]
    dims: [y, x]
    resolution: 10
    require_crs: true
    attrs:
      data_vars:
        '*':
          models:
            packing:
              required: [scale_factor]
  terrain:
    variables: [height]
    dims: [y, x]
    resolution: 10
    require_crs: true
preprocessing:
  reflectance:
    raster: optical
    variables: [nir, red]
    operations:
      - method: gs.to_nan
      - method: gs.unpack
inference:
  inputs:
    image:
      raster: reflectance
      layout: CHW
      dtype: float32
    elevation:
      raster: terrain
      layout: CHW
      dtype: float32
  tiling:
    raster: reflectance
    tile_shape: [4, 4]
postprocessing:
  method: segmentation
  classes: [background, water]
  thresholds: [0.5, 0.7]
