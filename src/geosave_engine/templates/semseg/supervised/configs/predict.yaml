# Model checkpoint to load
checkpoint: checkpoints/isprs_postdam_dpt_best.ckpt

# Dataset and metadata (same as training)
metadata: config/isprs_postdam/metadata.yaml

# Input data configuration
input_dir: dataset/isprs_postdam/images  # Directory with images to predict on
output_dir: outputs/predictions  # Where to save predictions

# Data loader for prediction
dataloader_cfg:
  batch_size: 4
  num_workers: 4
  pin_memory: true

# Inference configuration
inference_cfg:
  eval_mode: sliding_window  # or 'direct' for whole image
  overlap_ratio: 0.5  # For sliding window
  save_format: tiff  # Format to save predictions (tiff, png, npy)
  save_confidence: false  # Whether to save confidence maps
  post_processing:
    # Optional: morphological operations, CRF, etc.
    apply_crf: false
    # smooth: true