schema_version: 2
rasters:
  sentinel_2_l2a:
    variables: [B02, B03, B04, B08]
    coordinates: [x, y]
    require_crs: true
    stac:
      collection: sentinel-2-l2a
      endpoints:
        - planetary_computer
        - cdse
      load:
        bands: [B02, B03, B04, B08]
preprocessing:
  image:
    call: !ref sentinel_2_l2a.gs.mask_and_scale
# Features select variable and coordinate names from one Dataset. Their
# unnamed DataArray outputs are named when assigned back to the Dataset.
# Include B10 in variables/load.bands for this optional cloud/shadow example.
# Load sun azimuth under a plain name, since a !ref path cannot hold a colon:
#   rasters.sentinel_2_l2a.stac.load.with_properties:
#     - {key: "view:sun_azimuth", name: sun_azimuth}
#   preprocessing:
#     cloud:
#       call: geosave_engine.geodata.features.cirrus_cloud_mask
#       kwargs: {scene: !ref image, b10: B10}
#     cloud_scene:
#       call: !ref image.assign
#       kwargs: {cloud: !ref cloud}
#     shadow:
#       call: geosave_engine.geodata.features.shadow_mask
#       kwargs: {scene: !ref cloud_scene, cloud: cloud, sun_azimuth: sun_azimuth}
#     prepared:
#       call: !ref cloud_scene.assign
#       kwargs: {shadow: !ref shadow}
chips:
  size: 224
  overlap: 32
  mode: reflect
  window: hann
# Pixel bindings. Row-based context uses the same declaration in training and inference.
inputs:
  image: !ref image
# Enable the encoder's context recipe when the data supplies its metadata:
# context:
#   call: geosave_engine.model.encoder.prithvi.model_context
#   kwargs: {row: !ref row, raster: image}
# For Clay, use geosave_engine.model.encoder.clay.model_context.
# Run on the device after augmentation, in training, validation, and prediction.
# Reflectance statistics per band, in the order of `rasters.sentinel_2_l2a`.
transforms:
  image:
    - name: Normalize
      init_args:
        mean: [0.1105, 0.1355, 0.1552, 0.2743]
        std: [0.1809, 0.1757, 0.1888, 0.1742]
