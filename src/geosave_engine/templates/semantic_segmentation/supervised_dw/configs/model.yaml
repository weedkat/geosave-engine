model_name: UNet

trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:

model:
  encoder: dinov3
  decoder: dpt
  optimizer: AdamW.split
  scheduler: CosineAnnealingLR
  loss: CrossEntropyLoss
  config:
    encoder:
    decoder:
    optimizer:
      weight_decay: 0.01
      encoder_lr: 0.0001
      decoder_lr: 0.001
    scheduler:
      T_max: 100
    loss:
  threshold_calibration_config:
    metric: f1

data:
  batch_size: 16
  num_workers: 4
  root: data/dynamicworld
  ingest_dirs:
    train: data/dynamicworld_raw/train/
    val: data/dynamicworld_raw/val/
    test: data/dynamicworld_raw/test/

predict:
  data:
    root: run/
    ingest_bboxes:
      bbox: [-122.5, 37.7, -122.3, 37.8]
      datetime: "2020-01-01/2020-12-31"

predict:
  data:
    root: run/
    ingest_geojsons:
      src: data/geojsons/input.geojson
