model_name: MyModel

trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:

model:
  num_classes: 10       # update to match your LabelPipeline.schema
  in_channels: 3        # update to match your ImagePipeline.schema
  ignore_index: 255
  encoder: dinov3
  decoder: dpt
  optimizer: AdamW
  loss: CrossEntropyLoss
  config:
    encoder:
    decoder:
    optimizer:
      lr: 0.001

data:
  batch_size: 16
  num_workers: 4
  root: data/dataset
  ingest: false
  sources:
    train:
      type: geotiff
      src: data/raw/train/
    val:
      type: geotiff
      src: data/raw/val/
