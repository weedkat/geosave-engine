model_name: DynamicWorld

trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:

model:
  num_classes: 8
  in_channels: 13
  ignore_index: 255
  encoder: dinov3
  decoder: dpt
  optimizer: AdamW.split
  scheduler: CosineAnnealingLR
  loss: CrossEntropyLoss
  config:
    encoder:
    decoder:
    optimizer:
      weight_decay: 0.01
      encoder_lr: 0.0001
      decoder_lr: 0.001
    scheduler:
      T_max: 100
    loss:
  threshold_calibration_config:
    metric: f1

data:
  batch_size: 16
  num_workers: 4
  root: data/dynamicworld
