model_name: my_model

trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        filename: "epoch={epoch:02d}-val_loss={val_loss:.4f}"
        save_last: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.RichProgressBar

model:
  class_path: geosave_engine.ml.tasks.SemanticSegmentationTask
  init_args:
    in_channels: 4
    num_classes: 2
    input_size: 224
    ignore_index: 255
    model_chain:
      encoder: {name: dinov3}
      decoder: {name: dpt}
      head: {name: dense}
    optimizer:
      class_path: torch.optim.AdamW
      init_args: {lr: 0.001, weight_decay: 0.01}
      groups:
        encoder: {lr: 0.0001}
    lr_scheduler:
      class_path: torch.optim.lr_scheduler.CosineAnnealingLR
      init_args: {T_max: 100}
      interval: epoch
    criterion:
      class_path: torch.nn.CrossEntropyLoss
      init_args: {ignore_index: 255}
    metrics: [iou.macro, f1.macro]

data:
  class_path: modules.data.SegmentationDataModule
  init_args:
    train_path: data/train
    val_path: data/val
    input_size: 224
    batch_size: 8
    num_workers: 4
    augmentations: []
