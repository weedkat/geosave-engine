# GLOBAL CONFIGURATION
model:
  model_name: UNet
  model_config:
    dense_model:
      class_path: geosave_engine.models.UNet
      input_channels: 3
    # encoder: 
    #   class_path: geosave_engine.models.UNet
    #   input_channels: 3
    # decoder:
    #   class_path: geosave_engine.encoders.ResNetEncoder
    #   encoder_name: resnet34
    #   pretrained: True
  optim_config:
    - class_path: geosave_engine.optimizers.AdamW
      method: default
      lr: 0.0001
      scheduler:
        class_path: torch.optim.lr_scheduler.ReduceLROnPlateau
        factor: 0.1
        patience: 3
        config:
          monitor: val_loss
          frequency: 1

    - class_path: geosave_engine.optimizers.AdamW
      method: default
      lr: 0.001
      scheduler:
        class_path: torch.optim.lr_scheduler.LambdaLR
  loss_config:
    supervised:
      class_path: torch.nn.CrossEntropyLoss
      ignores_index: 255
    unsupervised:
      class_path: torch.nn.MSELoss
      

trainer:
  max_epochs: 100
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 10

# Fit configuration for the training loop, such as logging and checkpointing
fit:
  trainer:
    callbacks:
      - class_path: lightning.pytorch.callbacks.ModelCheckpoint
        monitor: val_loss
        mode: min
        save_top_k: 1
      - class_path: lightning.pytorch.callbacks.EarlyStopping
        monitor: val_loss
        mode: min
        patience: 10
    logger:
      - class_path: lightning.pytorch.loggers.TensorBoardLogger
        save_dir: artifacts
  data:
    data_dir: data/train
    batch_size: 16
    num_workers: 4
    patch_size: 256

test:
  trainer:
    logger:
      type: TensorBoardLogger
      save_dir: artifacts
      name: semantic_segmentation_test
  data:
    data_dir: data/train
    batch_size: 16
    num_workers: 4
    patch_size: 256

predict:
  trainer:
    logger:
      type: TensorBoardLogger
      save_dir: artifacts
      name: semantic_segmentation_predict
  data:
    data_dir: data/predict
    batch_size: 16
    num_workers: 4
    patch_size: 256
      

